<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>NYC Subway Tracker</title>
    <link rel="stylesheet" href="popup.css">
  </head>
  <body>
    <header class="topbar">
      <div>
        <p class="eyebrow">MTA REALTIME</p>
        <h1>Subway tracker</h1>
      </div>
    </header>

    <main>
      <details id="selector-panel" class="selector" open>
        <summary class="selector-toggle">
          <span>
            <span id="add-heading" class="selector-title">Track a stop</span>
            <span class="selector-caption">Choose a station and route</span>
          </span>
          <span class="toggle-mark" aria-hidden="true"></span>
        </summary>
        <div class="selector-body">
          <label for="station-input">Station</label>
          <div class="picker">
            <input id="station-input" type="search" role="combobox" aria-autocomplete="list" aria-expanded="false" aria-controls="station-options" placeholder="Search stations" autocomplete="off">
            <ul id="station-options" class="picker-options" role="listbox" hidden></ul>
          </div>
          <label for="route-input">Route</label>
          <div class="picker">
            <input id="route-input" type="search" role="combobox" aria-autocomplete="list" aria-expanded="false" aria-controls="route-options" placeholder="Search routes" autocomplete="off">
            <ul id="route-options" class="picker-options" role="listbox" hidden></ul>
          </div>
          <button id="add-button" class="primary-button" type="button">Add stop</button>
          <p id="load-status" class="status" role="status">Loading subway data...</p>
        </div>
      </details>

      <section class="tracked" aria-labelledby="tracked-heading">
        <div class="section-heading">
          <h2 id="tracked-heading">Your stops</h2>
          <button id="refresh-button" class="text-button" type="button" title="Refresh arrivals">Refresh</button>
        </div>
        <p id="empty-state" class="empty-state">Add a station and route to see arrivals.</p>
        <div id="favorites" class="favorites" aria-live="polite"></div>
      </section>
    </main>

    <script src="dist/popup.js"></script>
  </body>
</html>
